<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTU Marketplace</title>

    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">

        <div class="header-left">
            <a href="index.html" class="home-tab">Home</a>
            <h1>TTU Marketplace</h1>
        </div>

        <nav class="navigation">
            <a href="index.html">Home</a>
            <a href="#">Buying</a>
            <a href="#">Selling</a>
            <a href="#">Account</a>
            <a href="#">Cart</a>
        </nav>

        <div class="header-bottom">

            <div class="search-box">
                <span class="search-icon">⌕</span>
                <input
                    type="text"
                    placeholder="Search textbooks, supplies, electronics, and more..."
                >
            </div>

            <a href="#" class="cart-icon" aria-label="Shopping cart">
                <img src="cart.png" alt="shopping cart icon" width="30" height="30">
            </a>

            <a href="#" class="profile" aria-label="User profile">
                <img src="profile.png" alt="user profile icon" width="30" height="30">
            </a>

        </div>

    </header>


    <main>

        <!-- Welcome section -->

        <section class="hero">

            <div class="hero-content">

                <h2>
                    Welcome to<br>
                    Texas Tech Marketplace
                </h2>

                <div class="hero-buttons">
                    <a href="#" class="buy-button">Buying</a>
                    <a href="#" class="sell-button">Selling</a>
                </div>

            </div>

            <div class="hero-image">
                <img src="school.jpg"
                     alt="Texas Tech campus">
            </div>

        </section>


        <!-- Recently posted products -->

        <section class="products-section">

            <div class="section-heading">
                Recently posted items
            </div>

            <div class="products-container">

                <!-- Product 1 -->

                <article class="product-card">

                    <div class="product-image">
                        <img src="book.svg"
                             alt="Calculus textbook">
                    </div>

                    <div class="product-info">
                        <h3>Cal 1,2,and 3 textbook</h3>
                        <span class="price">60$</span>
                    </div>

                </article>


                <!-- Product 2 -->

                <article class="product-card">

                    <div class="product-image">
                        <img src="headphones.svg" 
                             alt="Wireless headphones">
                    </div>

                    <div class="product-info">
                        <h3>Wireless headphones</h3>
                        <span class="price">20$</span>
                    </div>

                </article>


                <!-- Product 3 -->

                <article class="product-card">

                    <div class="product-image">
                        <img src="scooter.svg"
                             alt="Electric scooter">
                    </div>

                    <div class="product-info">
                        <h3>Electric Scooter</h3>
                        <span class="price">50$</span>
                    </div>

                </article>


                <!-- Product 4 -->

                <article class="product-card">

                    <div class="product-image">
                        <img src="backpack.svg"
                             alt="Northface backpack">
                    </div>

                    <div class="product-info">
                        <h3>Northface Backpack</h3>
                        <span class="price">50$</span>
                    </div>

                </article>

            </div>

        </section>

    </main>


    <!-- Footer -->

    <footer class="footer">

        <div class="ttu-logo">
            <img src="ttu logo.png" alt="Texas Tech University logo" width="50" height="50">
        </div>

        <div class="footer-links">
            <a href="#">About Us</a>
            <a href="#">Contact Us</a>
        </div>

    </footer>

</body>
</html>
